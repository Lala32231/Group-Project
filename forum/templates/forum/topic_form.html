{% extends 'base.html' %}
{% load form_tags %}
{% block title %}Нова тема{% endblock %}
{% block content %}
<h2 class="mb-4">Нова тема форуму</h2>
<form method="post" class="col-md-8">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field|add_class:"form-control" }}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Створити</button>
</form>
{% endblock %}
