{% extends 'base.html' %}
{% block title %}Видалення новини{% endblock %}
{% block content %}
<h2>Видалити новину "{{ object.title }}"?</h2>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Так, видалити</button>
  <a href="{% url 'news:list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
